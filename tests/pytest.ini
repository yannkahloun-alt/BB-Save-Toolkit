[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*
addopts = -ra
markers =
    unit: fast, isolated unit tests
    integration: tests spanning multiple application modules
    slow: slower deterministic projection tests
    parser: binary save parser tests
    ui: HTML/CSS/JS regression tests
    advisor: Level-Up Advisor tests
    coverage_slow: tests intentionally excluded from instrumented coverage because tracing makes them pathologically slow
