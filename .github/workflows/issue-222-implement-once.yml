name: Issue 222 implement once
on:
  push:
    paths:
      - '.github/workflows/issue-222-implement-once.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-222-recruitment-unavailable-state
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply implementation
        shell: pwsh
        run: python .tmp_issue222_patch.py
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r tests/requirements.txt
      - name: Run targeted tests
        shell: pwsh
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest tests/unit/test_recruitment_ui.py tests/ui/test_recruitment_browser.py -q
      - name: Run targeted Ruff
        shell: pwsh
        run: python -m ruff check bbtool/app/recruitment_view.py tests/unit/test_recruitment_ui.py tests/ui/test_recruitment_browser.py
      - name: Run targeted Pyflakes
        shell: pwsh
        run: python -m pyflakes bbtool/app/recruitment_view.py tests/unit/test_recruitment_ui.py tests/ui/test_recruitment_browser.py
      - name: Commit implementation
        shell: pwsh
        run: |
          git rm .tmp_issue222_patch.py .github/workflows/issue-222-implement-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbtool/app/recruitment_view.py bbtool/app/static/app.js bbtool/app/static/recruitment.js tests/unit/test_recruitment_ui.py tests/ui/test_recruitment_browser.py docs/LOCAL_APPLICATION_API.md
          git commit -m "Present truthful unavailable Recruitment analytics"
          git push origin HEAD:codex/issue-222-recruitment-unavailable-state
