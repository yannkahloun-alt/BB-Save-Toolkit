name: Apply issue 231 implementation

on:
  push:
    branches:
      - codex/issue-231-relevant-need-availability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/issue-231-relevant-need-availability
          fetch-depth: 0

      - name: Apply focused availability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target_path = Path("bbtool/app/target_presentation.py")
          target = target_path.read_text(encoding="utf-8")

          anchor = '''EXCLUDED_RECRUIT_FIELDS = [
              "level", "settlement", "name", "title", "hire_cost", "daily_wage",
              "roster_need", "assigned_build", "hidden_stats", "talent_stars", "future_rolls",
          ]
          '''
          replacement = anchor + '''_AVAILABLE_RECRUITMENT_STATES = frozenset({
              "prior_only", "known_evidence_estimate",
          })


          def _candidate_potential_available(analyses: Any) -> bool:
              """Return true only when every build has established plausibility evidence."""
              return isinstance(analyses, list) and bool(analyses) and all(
                  isinstance(item, Mapping)
                  and item.get("state") in _AVAILABLE_RECRUITMENT_STATES
                  and isinstance(item.get("result"), Mapping)
                  for item in analyses
              )


          '''
          assert target.count(anchor) == 1
          target = target.replace(anchor, replacement)

          old_builder = '''    relevant_need = [{
              "recruit_index": row["recruit_index"],
              "state": "available" if assigned_available else "unavailable",
              "result": build_relevant_roster_need(
                  row["analyses"], company["intended_coverage"], viable_fit=0.5,
                  company_intrinsic_coverage=company_intrinsic_coverage,
              ) if assigned_available else None,
          } for row in recruitment_analysis]
          '''
          new_builder = '''    relevant_need = []
              for row in recruitment_analysis:
                  candidate_available = _candidate_potential_available(row.get("analyses"))
                  available = assigned_available and candidate_available
                  relevant_need.append({
                      "recruit_index": row["recruit_index"],
                      "state": "available" if available else "unavailable",
                      "result": build_relevant_roster_need(
                          row["analyses"], company["intended_coverage"], viable_fit=0.5,
                          company_intrinsic_coverage=company_intrinsic_coverage,
                      ) if available else None,
                  })
          '''
          assert target.count(old_builder) == 1
          target = target.replace(old_builder, new_builder)

          old_validator = '''    for item, recruitment in zip(relevant, payload["recruitment"], strict=True):
              if not isinstance(item, dict) or set(item) != {"recruit_index", "state", "result"}:
                  raise ValueError("target presentation relevant need is malformed")
              if item["state"] == "available":
                  expected = build_relevant_roster_need(
                      recruitment["analyses"], company["intended_coverage"], viable_fit=.5,
                      company_intrinsic_coverage=company["intrinsic_coverage"],
                  )
                  if item["result"] != expected:
                      raise ValueError("target presentation relevant need generation mismatch")
              elif item["state"] != "unavailable" or item["result"] is not None or company["intent_available"]:
                  raise ValueError("target presentation relevant need availability mismatch")
          '''
          new_validator = '''    for item, recruitment in zip(relevant, payload["recruitment"], strict=True):
              if not isinstance(item, dict) or set(item) != {"recruit_index", "state", "result"}:
                  raise ValueError("target presentation relevant need is malformed")
              candidate_available = _candidate_potential_available(recruitment["analyses"])
              should_be_available = company["intent_available"] and candidate_available
              if item["state"] == "available":
                  if not should_be_available:
                      raise ValueError("target presentation relevant need availability mismatch")
                  expected = build_relevant_roster_need(
                      recruitment["analyses"], company["intended_coverage"], viable_fit=.5,
                      company_intrinsic_coverage=company["intrinsic_coverage"],
                  )
                  if item["result"] != expected:
                      raise ValueError("target presentation relevant need generation mismatch")
              elif item["state"] != "unavailable" or item["result"] is not None \\
                      or should_be_available:
                  raise ValueError("target presentation relevant need availability mismatch")
          '''
          assert target.count(old_validator) == 1
          target = target.replace(old_validator, new_validator)
          target_path.write_text(target, encoding="utf-8")

          view_path = Path("bbtool/app/recruitment_view.py")
          view = view_path.read_text(encoding="utf-8")
          constant = '_AVAILABLE_POTENTIAL_STATES = frozenset({"prior_only", "known_evidence_estimate"})\n'
          assert view.count(constant) == 1
          view = view.replace(constant, "")
          old_view = '''            potential_available = any(
                  row.get("state") in _AVAILABLE_POTENTIAL_STATES
                  and (
                      row.get("background_prior_pct") is not None
                      or row.get("candidate_estimate_pct") is not None
                  )
                  for row in potentials
              )
              candidates.append({
                  "recruit_index": index,
                  "facts": facts,
                  "top_potential": _top_potential(potentials),
                  "potential": potentials,
                  "relevant_need": (
                      _relevant_need(need_by_index.get(index), builds)
                      if potential_available
                      else _unavailable_need()
                  ),
              })
          '''
          new_view = '''            candidates.append({
                  "recruit_index": index,
                  "facts": facts,
                  "top_potential": _top_potential(potentials),
                  "potential": potentials,
                  "relevant_need": _relevant_need(need_by_index.get(index), builds),
              })
          '''
          assert view.count(old_view) == 1
          view = view.replace(old_view, new_view)
          view_path.write_text(view, encoding="utf-8")

          docs_path = Path("docs/TARGET_PRESENTATION_CONTRACT.md")
          docs = docs_path.read_text(encoding="utf-8")
          old_docs = '''facts. `relevant_roster_need` is one separate mixed artifact per recruit; its
          candidate evidence and authoritative intended-coverage/intrinsic-coverage
          upstreams are recomputed and its signature must match. Unavailable intent is
          explicit rather than interpreted as Company need.
          '''
          new_docs = '''facts. `relevant_roster_need` is one separate mixed artifact per recruit; its
          candidate evidence and authoritative intended-coverage/intrinsic-coverage
          upstreams are recomputed and its signature must match. It is available only
          when Company intent is available and every build has established candidate
          plausibility evidence (`prior_only` or `known_evidence_estimate`). Any
          unavailable build keeps Relevant Need unavailable; partial evidence is not
          silently converted into proven implausibility. `no_match` therefore means a
          proven candidate-plausible role set has no relevant Company need, not that
          candidate plausibility could not be established. Unavailable intent is
          explicit rather than interpreted as Company need.
          '''
          assert docs.count(old_docs) == 1
          docs = docs.replace(old_docs, new_docs)
          docs_path.write_text(docs, encoding="utf-8")

          test_path = Path("tests/unit/test_relevant_need_availability_contract.py")
          test_path.write_text('''from __future__ import annotations

          from types import SimpleNamespace
          import threading

          from bbtool.app import recruitment_view
          from bbtool.app import target_presentation as presentation


          def _analysis(state: str, *, result=None) -> dict:
              return {
                  "build_identity": f"build:{state}",
                  "state": state,
                  "reason": "unavailable" if state == "unavailable" else None,
                  "result": result,
              }


          def _target(monkeypatch, analyses: list[dict], *, assigned_builds=None):
              calls = []

              def fake_relevant_need(*args, **kwargs):
                  calls.append((args, kwargs))
                  return {"schema": "bbtool.relevant_roster_need.v1", "marker": True}

              monkeypatch.setattr(
                  presentation, "build_relevant_roster_need", fake_relevant_need
              )
              payload = presentation.build_target_presentation(
                  bros=[],
                  recruits=[{}],
                  roles=[],
                  analysis_health={},
                  campaign_identity=None,
                  brother_identities={},
                  source_fingerprint="sha256:" + "a" * 64,
                  configuration_fingerprints={},
                  recruitment_analysis=[{
                      "recruit_index": 0,
                      "background_save_hash": None,
                      "analyses": analyses,
                  }],
                  artifact_hashes={key: "fixture" for key in presentation.BOUND_ARTIFACTS},
                  result_signatures={},
                  company_intrinsic_coverage=[],
                  summaries=[],
                  assigned_builds=assigned_builds,
                  company_intended_coverage=[],
              )
              return payload["relevant_roster_need"][0], calls


          def test_candidate_potential_requires_complete_supported_evidence():
              prior = _analysis("prior_only", result={})
              known = _analysis("known_evidence_estimate", result={})
              unavailable = _analysis("unavailable", result=None)

              assert not presentation._candidate_potential_available([])
              assert not presentation._candidate_potential_available([unavailable])
              assert not presentation._candidate_potential_available([prior, unavailable])
              assert presentation._candidate_potential_available([prior, known])


          def test_target_relevant_need_is_unavailable_when_candidate_evidence_is_missing(monkeypatch):
              item, calls = _target(
                  monkeypatch,
                  [_analysis("unavailable", result=None)],
                  assigned_builds={},
              )

              assert item == {"recruit_index": 0, "state": "unavailable", "result": None}
              assert calls == []


          def test_target_relevant_need_fails_closed_on_partial_candidate_evidence(monkeypatch):
              item, calls = _target(
                  monkeypatch,
                  [
                      _analysis("prior_only", result={}),
                      _analysis("unavailable", result=None),
                  ],
                  assigned_builds={},
              )

              assert item["state"] == "unavailable"
              assert item["result"] is None
              assert calls == []


          def test_target_relevant_need_is_available_only_with_candidate_and_company_evidence(monkeypatch):
              item, calls = _target(
                  monkeypatch,
                  [
                      _analysis("prior_only", result={}),
                      _analysis("known_evidence_estimate", result={}),
                  ],
                  assigned_builds={},
              )

              assert item["state"] == "available"
              assert item["result"] == {
                  "schema": "bbtool.relevant_roster_need.v1",
                  "marker": True,
              }
              assert len(calls) == 1

              without_intent, calls = _target(
                  monkeypatch,
                  [_analysis("prior_only", result={})],
                  assigned_builds=None,
              )
              assert without_intent["state"] == "unavailable"
              assert without_intent["result"] is None
              assert calls == []


          def test_recruitment_view_consumes_target_need_availability_without_reinferring(monkeypatch):
              result = SimpleNamespace(
                  diagnostics={},
                  roster=[],
                  recruits=[],
                  roles=[],
                  campaign_identity=None,
                  brother_identities={},
                  source_fingerprint="sha256:" + "b" * 64,
                  configuration_fingerprints={},
                  recruitment_analysis=[],
                  incremental_cache=SimpleNamespace(publication_signatures=lambda: {}),
                  analysis=SimpleNamespace(
                      company_intrinsic_coverage=[],
                      summaries=[],
                      company_intended_coverage=[],
                  ),
                  assigned_builds={},
                  public_data={
                      "recruits": [{
                          "Name": "Candidate",
                          "Settlement": "Town",
                      }]
                  },
              )
              application = SimpleNamespace(
                  _command_lock=threading.RLock(),
                  coordinator=SimpleNamespace(
                      last_success=SimpleNamespace(
                          result=result,
                          generation=7,
                          job_id="job-7",
                      )
                  ),
              )
              monkeypatch.setattr(
                  recruitment_view,
                  "build_target_presentation",
                  lambda **kwargs: {
                      "builds": [{
                          "build_identity": "build:test",
                          "display_name": "Test",
                      }],
                      "recruitment": [{
                          "recruit_index": 0,
                          "analyses": [{
                              "build_identity": "build:test",
                              "state": "unavailable",
                              "reason": "disabled",
                              "result": None,
                          }],
                      }],
                      "relevant_roster_need": [{
                          "recruit_index": 0,
                          "state": "available",
                          "result": {
                              "relevant_need": None,
                              "relevant_need_matches": [],
                              "other_company_gaps": [],
                          },
                      }],
                  },
              )

              view = recruitment_view.build_recruitment_view(application)
              candidate = view["settlements"][0]["candidates"][0]
              assert candidate["relevant_need"] == {
                  "state": "available",
                  "relevant": None,
                  "matches": [],
                  "other_company_gaps": [],
              }
          ''', encoding="utf-8")
          PY

          rm .github/workflows/issue-231-apply.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Relevant Need availability semantics"
          git push origin HEAD:codex/issue-231-relevant-need-availability
