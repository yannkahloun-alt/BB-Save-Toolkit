name: Issue 230 implement once
on:
  push:
    paths:
      - '.github/workflows/issue-230-implement-once.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-230-equipped-item-hash
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/issue230_patch.py
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run targeted tests
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest tests/unit/test_reference_source_only_items.py -q
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/issue-230-implement-once.yml .github/issue230_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/update_references.py tests/unit/test_reference_source_only_items.py docs/REFERENCE_SOURCES.md docs/sources/issue-230-item-hash-investigation.json .github/workflows/issue-230-implement-once.yml .github/issue230_patch.py
          git commit -m "Resolve source-only vanilla weapon references"
          git push origin HEAD:codex/issue-230-equipped-item-hash
