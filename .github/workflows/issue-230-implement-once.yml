name: Issue 230 implement once
on:
  push:
    paths:
      - '.github/workflows/issue-230-implement-once.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-230-equipped-item-hash
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Implement bounded source-only weapon references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

