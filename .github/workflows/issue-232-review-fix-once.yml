name: Issue 232 review fix once

on:
  push:
    branches:
      - codex/issue-232-publication-signatures
    paths:
      - .github/workflows/issue-232-review-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-232-publication-signatures
      - name: Enforce fail-closed publication signatures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          coordinator = Path('bbtool/app/analysis_coordinator.py')
          text = coordinator.read_text(encoding='utf-8')
          old = '''        try:\n            produced_signatures = result.incremental_cache.publication_signatures()\n            if not isinstance(produced_signatures, Mapping):\n                raise TypeError("publication signatures must be a mapping")\n        except AttributeError:\n            # Lightweight coordinator tests may use a transport-shaped result stub.\n            produced_signatures = {}\n        except Exception:\n            # Missing/corrupt authoritative signature evidence cannot publish as current.\n            job.status = JobStatus.SUPERSEDED\n            return\n'''
          new = '''        try:\n            produced_signatures = result.incremental_cache.publication_signatures()\n            if not isinstance(produced_signatures, Mapping):\n                raise TypeError("publication signatures must be a mapping")\n        except Exception:\n            # Missing/corrupt authoritative signature evidence cannot publish as current.\n            job.status = JobStatus.SUPERSEDED\n            return\n'''
          if old not in text:
              raise SystemExit('coordinator target block not found')
          coordinator.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/unit/test_analysis_coordinator.py')
          text = tests.read_text(encoding='utf-8')
          old = '''def result_for(item):\n    return SimpleNamespace(\n        source_fingerprint=item.source_fingerprint,\n        configuration_fingerprints=item.configuration_fingerprints,\n    )\n'''
          new = '''def result_for(item):\n    return SimpleNamespace(\n        source_fingerprint=item.source_fingerprint,\n        configuration_fingerprints=item.configuration_fingerprints,\n        incremental_cache=SimpleNamespace(publication_signatures=lambda: {}),\n    )\n'''
          if old not in text:
              raise SystemExit('result_for target block not found')
          text = text.replace(old, new, 1)
          anchor = '''    assert service.last_success.artifact_signatures == produced\n    assert service.last_success.artifact_signatures != item.dependency_signatures\n\n\n'''
          addition = '''    assert service.last_success.artifact_signatures == produced\n    assert service.last_success.artifact_signatures != item.dependency_signatures\n\n\ndef test_missing_authoritative_result_signatures_fail_closed():\n    backend = Backend()\n    service = coordinator(backend)\n    item = desired("save")\n    job_id = service.submit(item)\n    result = SimpleNamespace(\n        source_fingerprint=item.source_fingerprint,\n        configuration_fingerprints=item.configuration_fingerprints,\n    )\n    backend.handle.send("result", job_id, result)\n\n    service.poll()\n\n    assert service.job(job_id).status == JobStatus.SUPERSEDED\n    assert service.last_success is None\n\n\n'''
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          tests.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Commit review fix
        shell: bash
        run: |
          rm .github/workflows/issue-232-review-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbtool/app/analysis_coordinator.py tests/unit/test_analysis_coordinator.py .github/workflows/issue-232-review-fix-once.yml
          git commit -m "Fail closed on missing publication signatures"
          git push origin HEAD:codex/issue-232-publication-signatures
