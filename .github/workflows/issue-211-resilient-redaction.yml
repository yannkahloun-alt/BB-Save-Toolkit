name: Issue 211 resilient redaction helper

on:
  push:
    branches:
      - codex/issue-211-debug-export
    paths:
      - .github/workflows/issue-211-resilient-redaction.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-211-debug-export
          fetch-depth: 0
      - name: Make private-path discovery best effort
        shell: python
        run: |
          from pathlib import Path
          path = Path('bbtool/app/debug_export.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _redact_known_local_paths(application, value: Any) -> Any:\n    """Redact known machine-local roots while preserving diagnostic structure."""\n    followed = application.followed_save()\n    selected = followed.get("selected_path")\n    replacements = []\n'''
          new = '''def _redact_known_local_paths(application, value: Any) -> Any:\n    """Redact known machine-local roots while preserving diagnostic structure."""\n    try:\n        followed = application.followed_save()\n    except Exception:\n        followed = {}\n    selected = followed.get("selected_path")\n    replacements = []\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    followed = application.followed_save()\n    selected = followed.get("selected_path")\n    selected_path = selected if isinstance(selected, str) else None\n    return _redact_selected_save(safe, selected_path)\n'''
          new = '''    try:\n        followed = application.followed_save()\n    except Exception:\n        followed = {}\n    selected = followed.get("selected_path")\n    selected_path = selected if isinstance(selected, str) else None\n    return _redact_known_local_paths(\n        application, _redact_selected_save(safe, selected_path)\n    )\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit hardening and remove helper
        shell: bash
        run: |
          rm .github/workflows/issue-211-resilient-redaction.yml
          git config user.name "BB Save Toolkit Automation"
          git config user.email "bb-toolkit@local.invalid"
          git add bbtool/app/debug_export.py .github/workflows/issue-211-resilient-redaction.yml
          git commit -m "Keep debug export available when followed-save state fails"
          git push origin HEAD:codex/issue-211-debug-export