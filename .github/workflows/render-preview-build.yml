name: Render-only preview build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or exact commit to preview
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: render-preview-build-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build render-only preview
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_REF: ${{ inputs.source_ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=$PR_SHA" >> "$GITHUB_OUTPUT"
            echo "label=PR #$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "destination=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            safe=$(printf '%s' "$REQUESTED_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')
            test -n "$safe"
            echo "ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
            echo "label=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
            echo "destination=ref-$safe" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$EVENT_SHA" >> "$GITHUB_OUTPUT"
            echo "label=main" >> "$GITHUB_OUTPUT"
            echo "destination=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build approved scenarios without analysis
        shell: bash
        env:
          SOURCE_LABEL: ${{ steps.source.outputs.label }}
        run: |
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          python tools/build_web_previews.py \
            --catalog tests/fixtures/report_previews.json \
            --output preview-site \
            --source-label "$SOURCE_LABEL" \
            --source-sha "$(git rev-parse HEAD)" \
            --generated-at "$generated_at" \
            --destination "${{ steps.source.outputs.destination }}"
      - name: Upload publication input
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: render-preview
          path: preview-site
          if-no-files-found: error
          retention-days: 7
