name: Windows installer

on:
  pull_request:
    branches:
      - main
    paths:
      - "bb_windows.py"
      - "bbtool/app/windows_launcher.py"
      - "packaging/windows/**"
      - "tools/build_windows_installer.ps1"
      - "tools/smoke_windows_installer.ps1"
      - "tools/test_windows_installer_stale_launcher.ps1"
      - "docs/WINDOWS_DELIVERY.md"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: Installer version (defaults to bbtool.app.telemetry.TOOLKIT_VERSION)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/windows/requirements.txt
      - name: Install packaging and smoke dependencies
        run: python -m pip install -r packaging/windows/requirements.txt "selenium>=4.36,<5"
      - name: Ensure Inno Setup compiler is available
        shell: pwsh
        run: |
          $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $candidate)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows installer
        id: build
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) {
            $version = python -c "from bbtool.app.telemetry import TOOLKIT_VERSION; print(TOOLKIT_VERSION)"
          }
          $installer = ./tools/build_windows_installer.ps1 -Version $version | Select-Object -Last 1
          if (-not (Test-Path $installer)) { throw "Installer was not produced: $installer" }
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Smoke-test clean install, analysis, display, restart, update and uninstall
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.build.outputs.installer }}
        run: ./tools/smoke_windows_installer.ps1 -InstallerPath $env:INSTALLER_PATH
      - name: Regression-test repair with a stale broken launcher
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.build.outputs.installer }}
        run: ./tools/test_windows_installer_stale_launcher.ps1 -InstallerPath $env:INSTALLER_PATH
      - name: Upload validated installer
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: BB-Save-Toolkit-Windows-installer
          path: ${{ steps.build.outputs.installer }}
          if-no-files-found: error
          retention-days: 30
