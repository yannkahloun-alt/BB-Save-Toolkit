name: Patch issue 211 debug export integration

on:
  push:
    branches:
      - codex/issue-211-debug-export
    paths:
      - ".github/workflows/issue-211-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Patch API, UI and architecture contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "bbtool/app/app_server.py",
              "from dataclasses import dataclass\n",
              "from dataclasses import dataclass, field\n",
          )
          replace_once(
              "bbtool/app/app_server.py",
              "from .config import load_config\n",
              "from .config import load_config\nfrom .debug_export import build_debug_export\n",
          )
          replace_once(
              "bbtool/app/app_server.py",
              '    content_type: str = "application/json; charset=utf-8"\n',
              '    content_type: str = "application/json; charset=utf-8"\n    headers: Mapping[str, str] = field(default_factory=dict)\n',
          )
          replace_once(
              "bbtool/app/app_server.py",
              '            if method == "GET" and path == "/api/v1/shell":\n                return self._ok(self._shell_state())\n',
              '            if method == "GET" and path == "/api/v1/shell":\n                return self._ok(self._shell_state())\n            if method == "GET" and path == "/api/v1/debug-export":\n                with self.application._command_lock:\n                    if self.application.coordinator.last_success is None:\n                        raise ApplicationOperationError(\n                            "analysis_unavailable",\n                            "a completed published analysis is required for debug export",\n                        )\n                    archive, filename = build_debug_export(\n                        self.application, shell_builder=self._shell_state\n                    )\n                return HttpResponse(\n                    200,\n                    archive,\n                    "application/zip",\n                    {\n                        "Content-Disposition": (\n                            f\'attachment; filename="{filename}"\'\n                        )\n                    },\n                )\n',
          )
          replace_once(
              "bbtool/app/app_server.py",
              '                "request_too_large": 413,\n',
              '                "request_too_large": 413,\n                "analysis_unavailable": 409,\n',
          )
          replace_once(
              "bbtool/app/app_server.py",
              '            self.send_header("Content-Length", str(len(response.body)))\n            self.send_header("Cache-Control", "no-store")\n',
              '            self.send_header("Content-Length", str(len(response.body)))\n            for name, value in response.headers.items():\n                self.send_header(name, value)\n            self.send_header("Cache-Control", "no-store")\n',
          )

          replace_once(
              "bbtool/app/static/index.html",
              '        <button id="health-button" class="health-button" type="button" aria-expanded="false" aria-controls="health-panel" aria-live="polite" aria-atomic="true">\n          Run Health · —\n        </button>\n',
              '        <button id="health-button" class="health-button" type="button" aria-expanded="false" aria-controls="health-panel" aria-live="polite" aria-atomic="true">\n          Run Health · —\n        </button>\n        <button id="debug-export-button" class="health-button" type="button" disabled title="Available after a completed analysis">\n          Export debug JSON\n        </button>\n',
          )

          replace_once(
              "bbtool/app/static/app.js",
              'function renderShell() {\n  renderFollowedSave();\n  renderFreshness();\n  renderHealth();\n  renderProgress();\n  updateBrotherMutationAvailability();\n}\n',
              'function renderShell() {\n  renderFollowedSave();\n  renderFreshness();\n  renderHealth();\n  renderProgress();\n  const debugExportButton = document.getElementById(\'debug-export-button\');\n  const exportAvailable = Boolean(state.result?.available);\n  debugExportButton.disabled = !exportAvailable;\n  debugExportButton.title = exportAvailable\n    ? \'Download the current analysis and UI/API debug evidence bundle\'\n    : \'Available after a completed analysis\';\n  updateBrotherMutationAvailability();\n}\n',
          )
          replace_once(
              "bbtool/app/static/app.js",
              '  healthButton.addEventListener(\'click\', () => {\n    const open = healthButton.getAttribute(\'aria-expanded\') === \'true\';\n    healthButton.setAttribute(\'aria-expanded\', String(!open));\n    healthPanel.hidden = open;\n  });\n\n',
              '  healthButton.addEventListener(\'click\', () => {\n    const open = healthButton.getAttribute(\'aria-expanded\') === \'true\';\n    healthButton.setAttribute(\'aria-expanded\', String(!open));\n    healthPanel.hidden = open;\n  });\n\n  const debugExportButton = document.getElementById(\'debug-export-button\');\n  debugExportButton.addEventListener(\'click\', () => {\n    if (debugExportButton.disabled) return;\n    const link = document.createElement(\'a\');\n    link.href = \'/api/v1/debug-export\';\n    document.body.append(link);\n    link.click();\n    link.remove();\n  });\n\n',
          )

          replace_once(
              "bbtool/app/static/app.css",
              '.health-button:hover {\n  border-color: #4b5a70;\n}\n',
              '.health-button:hover {\n  border-color: #4b5a70;\n}\n\n.health-button:disabled {\n  cursor: not-allowed;\n  opacity: 0.55;\n}\n',
          )

          replace_once(
              "docs/ARCHITECTURE.md",
              "Generated reports consume the returned\nanalysis directly; they do not recompute projections.\n\nService failures carry stable `code`, `stage`, and `message` fields.",
              "Generated reports consume the returned\nanalysis directly; they do not recompute projections.\n\nThe local application also exposes a generation-bound debug export for real-save\ntriage. It packages the existing public analysis/report evidence together with\nthe exact Company, Level Up, Recruitment, shell, followed-save, analysis-result,\nand effective-archetype read models consumed by the UI. A manifest binds every\nmember to the represented publication generation/source/configuration, while a\nversioned diagnostic inventory records explicit `unknown`, `unavailable`,\ndegraded, warning, and reason states by JSON path. The export never includes\nsave bytes and redacts the absolute followed-save path; it is observability only\nand does not infer missing game facts.\n\nService failures carry stable `code`, `stage`, and `message` fields.",
          )
          PY

          rm .github/workflows/issue-211-patch.yml
          git config user.name "BB Save Toolkit Automation"
          git config user.email "bb-toolkit@local.invalid"
          git add bbtool/app/app_server.py bbtool/app/static/index.html bbtool/app/static/app.js bbtool/app/static/app.css docs/ARCHITECTURE.md .github/workflows/issue-211-patch.yml
          git commit -m "Expose generation-bound debug JSON export"
          git push origin HEAD:codex/issue-211-debug-export
