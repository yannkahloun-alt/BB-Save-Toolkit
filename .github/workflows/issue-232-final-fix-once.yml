name: Issue 232 final fix once

on:
  push:
    branches:
      - codex/issue-232-publication-signatures

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-232-publication-signatures
      - name: Apply exact CI corrections and clean accidental branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          deps = Path('bbtool/incremental/dependencies.py')
          text = deps.read_text(encoding='utf-8')
          old = 'def input_signature(kind: "InputKind", evidence: Any) -> str:'
          new = 'def input_signature(kind: InputKind, evidence: Any) -> str:'
          if old not in text:
              raise SystemExit('Ruff annotation anchor missing')
          deps.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          test = Path('tests/integration/test_web_quality_gates.py')
          text = test.read_text(encoding='utf-8')
          old = 'assert automatic_desired.artifact_signatures == manual_desired.artifact_signatures'
          new = 'assert automatic_desired.dependency_signatures == manual_desired.dependency_signatures'
          if old not in text:
              raise SystemExit('integration compatibility anchor missing')
          test.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          Path('.github/workflows/issue-232-final-fix-once.yml').unlink()
          PY
          git push origin --delete codex/issue-232-publication-signatures-work || true
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix issue 232 exact-head validation findings'
          git push origin HEAD:codex/issue-232-publication-signatures
