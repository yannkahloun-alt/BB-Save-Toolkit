name: Publish full application preview

on:
  workflow_run:
    workflows: [Full application preview build]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: full-preview-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download unprivileged publication artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "full-preview" and .expired == false) | .id')
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > preview.zip
          mkdir preview
          unzip -q preview.zip -d preview
      - name: Validate payload and live destination
        id: payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/validate_full_preview_artifact.py preview \
            --catalog tests/fixtures/full_preview/catalog.json > context.json
          destination=$(python -c 'import json; print(json.load(open("context.json"))["destination"])')
          fixture=$(python -c 'import json; print(json.load(open("context.json"))["fixture"])')
          source_sha=$(python -c 'import json; print(json.load(open("context.json"))["source_sha"])')
          if [[ "$destination" =~ ^pr-([0-9]+)/full$ ]]; then
            number=${BASH_REMATCH[1]}
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .state)
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .head.sha)
            test "$state" = open
            test "$current_sha" = "$source_sha"
          else
            gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --silent
          fi
          rm preview/preview-context.json
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "fixture=$fixture" >> "$GITHUB_OUTPUT"
      - name: Update persistent preview site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DESTINATION: ${{ steps.payload.outputs.destination }}
        run: |
          git init published
          cd published
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin gh-pages; then
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi
          rm -rf -- "$DESTINATION"
          mkdir -p -- "$DESTINATION"
          cp -R ../preview/. "$DESTINATION/"
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update full application preview: $DESTINATION"
          git push origin HEAD:gh-pages
      - name: Publish preview link
        shell: bash
        env:
          DESTINATION: ${{ steps.payload.outputs.destination }}
          FIXTURE: ${{ steps.payload.outputs.fixture }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repository=${GITHUB_REPOSITORY#*/}
          echo "## Full application preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Open ${FIXTURE}](https://${owner}.github.io/${repository}/${DESTINATION}/${FIXTURE}/)" >> "$GITHUB_STEP_SUMMARY"
