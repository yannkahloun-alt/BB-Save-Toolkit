name: Issue 211 path redaction helper

on:
  push:
    branches:
      - codex/issue-211-debug-export
    paths:
      - .github/workflows/issue-211-path-redaction.yml

permissions:
  contents: write

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-211-debug-export
          fetch-depth: 0
      - name: Redact known local roots from API snapshots
        shell: python
        run: |
          from pathlib import Path

          path = Path('bbtool/app/debug_export.py')
          text = path.read_text(encoding='utf-8')
          marker = '''def _sanitized_followed_save(application) -> dict[str, Any]:\n    raw = deepcopy(application.followed_save())\n    selected = raw.get("selected_path")\n    selected_path = selected if isinstance(selected, str) else None\n    sanitized = _redact_selected_save(raw, selected_path)\n    if selected_path is not None:\n        sanitized["selected_path"] = "<redacted>"\n        sanitized["selected_path_redacted"] = True\n    return sanitized\n\n\n'''
          replacement = marker + '''def _redact_known_local_paths(application, value: Any) -> Any:\n    """Redact known machine-local roots while preserving diagnostic structure."""\n    followed = application.followed_save()\n    selected = followed.get("selected_path")\n    replacements = []\n    if isinstance(selected, str) and selected:\n        replacements.append((selected, "<selected-save>"))\n    store = getattr(application, "store", None)\n    root = getattr(store, "root", None)\n    if root is not None:\n        root_text = str(root)\n        if root_text:\n            replacements.append((root_text, "<user-state>"))\n    replacements.sort(key=lambda item: len(item[0]), reverse=True)\n\n    def redact(item: Any) -> Any:\n        if isinstance(item, Mapping):\n            return {key: redact(child) for key, child in item.items()}\n        if isinstance(item, list):\n            return [redact(child) for child in item]\n        if isinstance(item, str):\n            for private, replacement_text in replacements:\n                item = item.replace(private, replacement_text)\n            return item\n        return item\n\n    return redact(value)\n\n\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''        api_snapshots = {\n            "api/shell.json": _capture(shell_builder),\n            "api/followed-save.json": _capture(\n                lambda: _sanitized_followed_save(application)\n            ),\n            "api/analysis-result.json": _capture(application.last_result),\n            "api/company-brother.json": _capture(\n                lambda: build_company_brother_view(application)\n            ),\n            "api/level-up.json": _capture(\n                lambda: build_level_up_view(application)\n            ),\n            "api/recruitment.json": _capture(\n                lambda: build_recruitment_view(application)\n            ),\n            "api/effective-archetypes.json": _capture(\n                application.effective_archetypes\n            ),\n        }\n'''
          replacement = '''        api_snapshots = {\n            "api/shell.json": _capture(shell_builder),\n            "api/followed-save.json": _capture(\n                lambda: _sanitized_followed_save(application)\n            ),\n            "api/analysis-result.json": _capture(application.last_result),\n            "api/company-brother.json": _capture(\n                lambda: build_company_brother_view(application)\n            ),\n            "api/level-up.json": _capture(\n                lambda: build_level_up_view(application)\n            ),\n            "api/recruitment.json": _capture(\n                lambda: build_recruitment_view(application)\n            ),\n            "api/effective-archetypes.json": _capture(\n                application.effective_archetypes\n            ),\n        }\n        api_snapshots = {\n            path: _redact_known_local_paths(application, payload)\n            for path, payload in api_snapshots.items()\n        }\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''                "api_effective_archetypes": "live command-boundary catalog; may be newer than publication",\n            },\n            "privacy": {\n'''
          replacement = '''                "api_effective_archetypes": "live command-boundary catalog; may be newer than publication",\n                "api_path_redaction": "known selected-save and user-state roots are replaced with placeholders",\n            },\n            "privacy": {\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

          docs = Path('docs/ARCHITECTURE.md')
          text = docs.read_text(encoding='utf-8')
          old = 'Sanitized runtime diagnostics include parse/run-health/cache/projection/timing evidence while deliberately excluding path-bearing reference-runtime internals.'
          new = 'Sanitized runtime diagnostics include parse/run-health/cache/projection/timing evidence while deliberately excluding path-bearing reference-runtime internals. Known selected-save and user-state roots are redacted across exported API snapshots.'
          assert old in text
          docs.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit redaction and remove helper
        shell: bash
        run: |
          rm .github/workflows/issue-211-path-redaction.yml
          git config user.name "BB Save Toolkit Automation"
          git config user.email "bb-toolkit@local.invalid"
          git add bbtool/app/debug_export.py docs/ARCHITECTURE.md .github/workflows/issue-211-path-redaction.yml
          git commit -m "Redact known local paths from debug API snapshots"
          git push origin HEAD:codex/issue-211-debug-export