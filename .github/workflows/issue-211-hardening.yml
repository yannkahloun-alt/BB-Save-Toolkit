name: Issue 211 debug export hardening

on:
  push:
    branches:
      - codex/issue-211-debug-export
    paths:
      - .github/workflows/issue-211-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-211-debug-export
          fetch-depth: 0
      - name: Apply security, coherence, and runtime diagnostic hardening
        shell: python
        run: |
          from pathlib import Path

          debug = Path('bbtool/app/debug_export.py')
          text = debug.read_text(encoding='utf-8')

          marker = '_INCOMPLETE_STATES = frozenset({"unknown", "unavailable", "degraded", "failed", "failure", "error"})\n'
          replacement = marker + '''\n\nclass DebugExportGenerationChanged(RuntimeError):\n    """The published analysis changed while an export was being assembled."""\n\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''def _capture(builder: Callable[[], Any]) -> Any:\n    """Keep the bundle available even if one UI read model itself is broken."""\n    try:\n        return builder()\n    except Exception as exc:\n        return {\n            "available": False,\n            "debug_capture_error": {\n                "type": type(exc).__name__,\n                "message": "read model raised while building debug evidence",\n            },\n        }\n\n\n'''
          replacement = marker + '''def _runtime_diagnostics(application, result) -> dict[str, Any]:\n    """Expose safe algorithm diagnostics while excluding path-heavy reference internals."""\n    diagnostics = deepcopy(getattr(result, "diagnostics", {}) or {})\n    safe = {\n        key: diagnostics.get(key)\n        for key in (\n            "parse",\n            "run_health",\n            "projection_profile",\n            "validation_projection",\n            "cache_miss_reasons",\n        )\n        if key in diagnostics\n    }\n    safe["timings"] = dict(getattr(result, "timings", {}) or {})\n    safe["warnings"] = deepcopy(getattr(result, "warnings", []) or [])\n    safe["excluded"] = {\n        "references": (\n            "reference-runtime diagnostics are excluded because they may contain "\n            "machine-local cache paths; unresolved reference evidence remains in run_health"\n        ),\n        "progress_events": (\n            "worker progress is excluded because reference-stage details may contain "\n            "machine-local paths; completed stage timings are exported above"\n        ),\n    }\n    followed = application.followed_save()\n    selected = followed.get("selected_path")\n    selected_path = selected if isinstance(selected, str) else None\n    return _redact_selected_save(safe, selected_path)\n\n\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''        files["analysis/projection-validation.json"] = _json_bytes(\n            result.projection_validation\n        )\n\n        api_snapshots = {\n'''
          replacement = '''        files["analysis/projection-validation.json"] = _json_bytes(\n            result.projection_validation\n        )\n        runtime_diagnostics = _runtime_diagnostics(application, result)\n        files["analysis/runtime-diagnostics.json"] = _json_bytes(runtime_diagnostics)\n\n        api_snapshots = {\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''        inventory_inputs["analysis/target-presentation.json"] = presentation\n        inventory = build_diagnostic_inventory(inventory_inputs)\n'''
          replacement = '''        inventory_inputs["analysis/target-presentation.json"] = presentation\n        inventory_inputs["analysis/runtime-diagnostics.json"] = runtime_diagnostics\n        inventory = build_diagnostic_inventory(inventory_inputs)\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''        filename = f"{_DOWNLOAD_PREFIX}-generation-{publication.generation}.zip"\n        return archive.getvalue(), filename\n\n\n__all__ = [\n'''
          replacement = '''        current_publication = application.coordinator.last_success\n        if (\n            current_publication is not publication\n            or current_publication.generation != publication.generation\n            or current_publication.job_id != publication.job_id\n        ):\n            raise DebugExportGenerationChanged(\n                "published analysis changed while debug export was being assembled"\n            )\n        filename = f"{_DOWNLOAD_PREFIX}-generation-{publication.generation}.zip"\n        return archive.getvalue(), filename\n\n\n__all__ = [\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''    "DEBUG_EXPORT_SCHEMA",\n    "DIAGNOSTIC_INVENTORY_SCHEMA",\n'''
          replacement = '''    "DEBUG_EXPORT_SCHEMA",\n    "DIAGNOSTIC_INVENTORY_SCHEMA",\n    "DebugExportGenerationChanged",\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          debug.write_text(text, encoding='utf-8')

          server = Path('bbtool/app/app_server.py')
          text = server.read_text(encoding='utf-8')
          marker = 'from .debug_export import build_debug_export\n'
          replacement = 'from .debug_export import DebugExportGenerationChanged, build_debug_export\n'
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''            if method == "GET" and path == "/api/v1/debug-export":\n                with self.application._command_lock:\n'''
          replacement = '''            if method == "GET" and path == "/api/v1/debug-export":\n                if not secrets.compare_digest(\n                    headers.get("x-bbst-session", ""), self.token\n                ):\n                    raise ApplicationOperationError(\n                        "invalid_session",\n                        "debug export session capability is invalid",\n                    )\n                with self.application._command_lock:\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''                    archive, filename = build_debug_export(\n                        self.application, shell_builder=self._shell_state\n                    )\n                return HttpResponse(\n'''
          replacement = '''                    try:\n                        archive, filename = build_debug_export(\n                            self.application, shell_builder=self._shell_state\n                        )\n                    except DebugExportGenerationChanged as exc:\n                        raise ApplicationOperationError(\n                            "debug_export_generation_changed",\n                            "analysis changed while debug export was built; retry the export",\n                        ) from exc\n                return HttpResponse(\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          marker = '''                "analysis_unavailable": 409,\n'''
          replacement = '''                "analysis_unavailable": 409,\n                "debug_export_generation_changed": 409,\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          server.write_text(text, encoding='utf-8')

          appjs = Path('bbtool/app/static/app.js')
          text = appjs.read_text(encoding='utf-8')
          marker = '''  const debugExportButton = document.getElementById('debug-export-button');\n  debugExportButton.addEventListener('click', () => {\n    if (debugExportButton.disabled) return;\n    const link = document.createElement('a');\n    link.href = '/api/v1/debug-export';\n    document.body.append(link);\n    link.click();\n    link.remove();\n  });\n'''
          replacement = '''  const debugExportButton = document.getElementById('debug-export-button');\n  debugExportButton.addEventListener('click', async () => {\n    if (debugExportButton.disabled) return;\n    debugExportButton.disabled = true;\n    try {\n      if (!state.sessionToken) {\n        state.sessionToken = (await fetchData('/api/v1/session')).token;\n      }\n      const response = await fetch('/api/v1/debug-export', {\n        credentials: 'same-origin',\n        cache: 'no-store',\n        headers: {'X-BBST-Session': state.sessionToken},\n      });\n      if (!response.ok) {\n        const payload = await response.json();\n        throw new Error(payload.error?.message || `Export failed (${response.status})`);\n      }\n      const blob = await response.blob();\n      const disposition = response.headers.get('Content-Disposition') || '';\n      const filename = /filename="([^"]+)"/.exec(disposition)?.[1]\n        || 'BB-Save-Toolkit-debug-json.zip';\n      const href = URL.createObjectURL(blob);\n      const link = document.createElement('a');\n      link.href = href;\n      link.download = filename;\n      document.body.append(link);\n      link.click();\n      link.remove();\n      URL.revokeObjectURL(href);\n      debugExportButton.title = 'Debug JSON downloaded';\n    } catch (error) {\n      debugExportButton.title = error?.message || 'Debug export failed';\n    } finally {\n      debugExportButton.disabled = !state.result?.available;\n    }\n  });\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          appjs.write_text(text, encoding='utf-8')

          docs = Path('docs/ARCHITECTURE.md')
          text = docs.read_text(encoding='utf-8')
          addition = '''\n- Debug export downloads require the local session capability, are assembled from one published generation, and abort with a retryable conflict if a newer generation publishes during capture. Sanitized runtime diagnostics include parse/run-health/cache/projection/timing evidence while deliberately excluding path-bearing reference-runtime internals.\n'''
          if addition.strip() not in text:
              text += addition
          docs.write_text(text, encoding='utf-8')
      - name: Commit hardening and remove helper
        shell: bash
        run: |
          rm .github/workflows/issue-211-hardening.yml
          git config user.name "BB Save Toolkit Automation"
          git config user.email "bb-toolkit@local.invalid"
          git add bbtool/app/debug_export.py bbtool/app/app_server.py bbtool/app/static/app.js docs/ARCHITECTURE.md .github/workflows/issue-211-hardening.yml
          git commit -m "Harden debug export generation and session boundary"
          git push origin HEAD:codex/issue-211-debug-export