name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - name: Install dev dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Full correctness suite
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest -q
      - name: Pyflakes
        shell: pwsh
        run: ./run_lint.ps1 -Tests
      - name: Ruff
        shell: pwsh
        run: ./run_ruff.ps1 -Tests
