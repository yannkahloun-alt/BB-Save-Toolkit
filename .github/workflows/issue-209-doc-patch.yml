name: Patch issue 209 Windows delivery contract

on:
  push:
    branches:
      - codex/issue-209-installer-stale-launcher

permissions:
  contents: write

jobs:
  patch-docs:
    if: ${{ github.event.head_commit.message == 'Patch issue 209 Windows delivery contract' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update Windows delivery contract and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/WINDOWS_DELIVERY.md')
          text = path.read_text(encoding='utf-8')
          old = '''Running the same or a newer installer is the **repair/update** operation. Before
          replacing binaries the installer asks the existing launcher to stop. If the
          launcher cannot verify and stop a healthy existing instance, repair/update
          aborts instead of replacing files underneath a running process. Durable state
          is not under `{app}` and therefore survives the replacement. State schema
          migration remains owned by `bbtool.app.user_state`; packaging must never edit
          feature files directly.
          '''
          new = '''Running the same or a newer installer is the **repair/update** operation. Before
          replacing binaries the installer checks the launcher's per-session application
          mutex. If no toolkit instance owns that mutex, a stale or non-startable previous
          executable is not launched merely because it remains on disk. If the mutex does
          prove an application instance is running, the installer asks the existing
          launcher to perform its verified stop; failure still aborts repair/update rather
          than replacing files underneath a running process. Durable state is not under
          `{app}` and therefore survives the replacement. State schema migration remains
          owned by `bbtool.app.user_state`; packaging must never edit feature files directly.
          '''
          if old not in text:
              raise SystemExit('repair/update contract paragraph not found')
          text = text.replace(old, new, 1)
          old_bullet = '''- installer repair/update preserves that durable state;
          - default uninstall preserves durable user state;
          '''
          new_bullet = '''- installer repair/update preserves that durable state;
          - repair/update succeeds when no app is running even if the previous installed
            launcher is stale or cannot initialize;
          - default uninstall preserves durable user state;
          '''
          if old_bullet not in text:
              raise SystemExit('validation bullet anchor not found')
          path.write_text(text.replace(old_bullet, new_bullet, 1), encoding='utf-8')
          PY
          rm .github/workflows/issue-209-doc-patch.yml
          git config user.name "BB Save Toolkit Automation"
          git config user.email "bb-toolkit@local.invalid"
          git add docs/WINDOWS_DELIVERY.md .github/workflows/issue-209-doc-patch.yml
          git commit -m "Document stale-launcher repair guard"
          git push origin HEAD:codex/issue-209-installer-stale-launcher
