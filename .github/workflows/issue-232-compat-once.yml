name: Issue 232 coordinator compatibility once

on:
  push:
    branches:
      - codex/issue-232-publication-signatures

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-232-publication-signatures
      - name: Make dependency binding duck-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bbtool/app/local_application.py')
          text = path.read_text(encoding='utf-8')
          old = '''        self.coordinator = coordinator or AnalysisCoordinator()\n        self.coordinator.configure_dependency_validation(\n            lambda signatures: dependency_signatures_are_current(\n                signatures,\n                catalog=self.catalog,\n                classification=self.classification,\n                assigned_builds=self.assigned_builds,\n            )\n        )\n        self._read_save = read_save or Path.read_bytes'''
          new = '''        self.coordinator = coordinator or AnalysisCoordinator()\n        configure_dependency_validation = getattr(\n            self.coordinator, "configure_dependency_validation", None\n        )\n        if callable(configure_dependency_validation):\n            configure_dependency_validation(\n                lambda signatures: dependency_signatures_are_current(\n                    signatures,\n                    catalog=self.catalog,\n                    classification=self.classification,\n                    assigned_builds=self.assigned_builds,\n                )\n            )\n        self._read_save = read_save or Path.read_bytes'''
          if old not in text:
              raise SystemExit('local application binding anchor missing')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          Path('.github/workflows/issue-232-compat-once.yml').unlink()
          PY
      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep local publication coordinator binding compatible'
          git push origin HEAD:codex/issue-232-publication-signatures
