name: Issue 230 source type mapping audit once

on:
  push:
    branches:
      - codex/issue-230-equipped-item-hash
    paths:
      - .github/workflows/issue-230-type-mapping-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-230-equipped-item-hash
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit source create-parent to dictionary type mapping
        shell: bash
        run: |
          python - <<'PY'
          import io, json, re, zipfile
          from collections import defaultdict, Counter
          from pathlib import Path
          from references import update_references as refs

          evidence_path = Path('docs/sources/issue-230-item-hash-investigation.json')
          payload = json.loads(evidence_path.read_text(encoding='utf-8'))
          bbedit = refs.download_reference_dictionary()
          archive_bytes = refs._download_bytes(refs.BB_SCRIPTS_ZIP_URL, timeout=45)
          model = refs._extract_script_item_values(archive_bytes)
          by_hash = model['by_save_hash']
          create_re = re.compile(r'\bthis\.([a-z0-9_]+)\.create\s*\(\s*\)\s*;')
          matrix = defaultdict(Counter)
          source_only_parents = Counter()
          target_parent = None
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              texts = {}
              for info in archive.infolist():
                  p = info.filename.replace('\\', '/')
                  marker = '/scripts/items/'
                  if marker not in p or not p.endswith('.nut'):
                      continue
                  rel = 'scripts/items/' + p.split(marker, 1)[1]
                  try:
                      texts[rel] = archive.read(info).decode('utf-8-sig')
                  except UnicodeDecodeError:
                      continue
          for save_hash, records in by_hash.items():
              for record in records:
                  text = texts.get(record['Source'], '')
                  match = create_re.search(text)
                  parent = match.group(1) if match else '<none>'
                  if save_hash == '35A5074F':
                      target_parent = parent
                  if save_hash in bbedit:
                      typ = bbedit[save_hash].get('type') or '<none>'
                      matrix[parent][typ] += 1
                  else:
                      source_only_parents[parent] += 1
          payload['type_mapping_audit'] = {
              'target_create_parent': target_parent,
              'shared_hash_parent_to_bbedit_type_counts': {
                  parent: dict(sorted(counts.items()))
                  for parent, counts in sorted(matrix.items())
              },
              'source_only_create_parent_counts': dict(sorted(source_only_parents.items())),
          }
          evidence_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(payload['type_mapping_audit'], indent=2, ensure_ascii=False))
          PY
      - name: Commit type mapping audit
        shell: bash
        run: |
          rm .github/workflows/issue-230-type-mapping-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sources/issue-230-item-hash-investigation.json .github/workflows/issue-230-type-mapping-audit-once.yml
          git commit -m "Audit source item type mapping"
          git push origin HEAD:codex/issue-230-equipped-item-hash
