name: Issue 222 partial-evidence review fix
on:
  push:
    paths:
      - '.github/workflows/issue-222-review-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-222-recruitment-unavailable-state
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply review fix
        shell: pwsh
        run: python .tmp_issue222_review_fix.py
      - name: Install browser-test dependencies
        shell: pwsh
        run: python -m pip install -r tests/requirements.txt
      - name: Run focused browser regression
        shell: pwsh
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest tests/ui/test_recruitment_browser.py -q
      - name: Commit review fix
        shell: pwsh
        run: |
          git rm .tmp_issue222_review_fix.py .github/workflows/issue-222-review-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbtool/app/static/recruitment.js tests/ui/test_recruitment_browser.py
          git commit -m "Clarify partial Recruitment evidence summary"
          git push origin HEAD:codex/issue-222-recruitment-unavailable-state
