name: Issue 222 additive availability contract fix
on:
  push:
    paths:
      - '.github/workflows/issue-222-contract-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-222-recruitment-unavailable-state
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply contract fix
        shell: pwsh
        run: python .tmp_issue222_contract_fix.py
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r tests/requirements.txt
      - name: Run Recruitment compatibility and browser tests
        shell: pwsh
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest tests/unit/test_recruitment_ui.py tests/unit/test_recruitment_production_policy.py tests/unit/test_relevant_need_availability_contract.py tests/ui/test_recruitment_browser.py -q
      - name: Isolate unrelated Debug Export browser test
        shell: pwsh
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest tests/ui/test_debug_export_browser.py::test_debug_export_control_tracks_publication_and_downloads_with_session -q
      - name: Run targeted Ruff
        shell: pwsh
        run: python -m ruff check bbtool/app/recruitment_view.py tests/unit/test_recruitment_ui.py tests/unit/test_recruitment_production_policy.py tests/unit/test_relevant_need_availability_contract.py tests/ui/test_recruitment_browser.py
      - name: Run targeted Pyflakes
        shell: pwsh
        run: python -m pyflakes bbtool/app/recruitment_view.py tests/unit/test_recruitment_ui.py tests/unit/test_recruitment_production_policy.py tests/unit/test_relevant_need_availability_contract.py tests/ui/test_recruitment_browser.py
      - name: Commit contract fix
        shell: pwsh
        run: |
          git rm .tmp_issue222_contract_fix.py .github/workflows/issue-222-contract-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbtool/app/recruitment_view.py bbtool/app/static/recruitment.js docs/LOCAL_APPLICATION_API.md tests/unit/test_recruitment_ui.py tests/ui/test_recruitment_browser.py
          git commit -m "Keep Recruitment availability metadata additive"
          git push origin HEAD:codex/issue-222-recruitment-unavailable-state
