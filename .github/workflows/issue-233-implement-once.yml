name: Issue 233 implement once
on:
  push:
    paths:
      - '.github/workflows/issue-233-implement-once.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-233-weapon-family-metadata
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply implementation
        run: python .github/issue233_patch.py
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run targeted tests
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest tests/unit/test_weapon_mastery_reference.py tests/unit/test_perk_gear_facts.py tests/unit/test_roster_equipment.py -q
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/issue-233-implement-once.yml .github/issue233_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/update_references.py bbtool/save_parser.py bbtool/perk_gear.py tests/unit/test_weapon_mastery_reference.py tests/unit/test_perk_gear_facts.py tests/unit/test_roster_equipment.py docs/PERK_GEAR_FACTS.md docs/REFERENCE_SOURCES.md docs/sources/issue-233-weapon-family-investigation.json .github/workflows/issue-233-implement-once.yml .github/issue233_patch.py
          git commit -m "Add source-derived weapon mastery families"
          git push origin HEAD:codex/issue-233-weapon-family-metadata
