name: Issue 230 post-fix pinned output audit
on:
  push:
    paths:
      - '.github/workflows/issue-230-postfix-audit-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-230-equipped-item-hash
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build exact pinned dictionary and record source-only output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from references import update_references as refs

          bbedit = refs.download_reference_dictionary()
          archive = refs._download_bytes(refs.BB_SCRIPTS_ZIP_URL, timeout=45)
          output = Path('/tmp/issue230-dictionary.json')
          stats = refs.build_reference_dictionary(
              output, bbedit_dictionary=bbedit, scripts_archive=archive
          )
          generated = json.loads(output.read_text(encoding='utf-8'))['entries']
          source_only = [
              {'save_hash': key, **value}
              for key, value in sorted(generated.items())
              if value.get('ReferenceSource') == 'vanilla-script-source-only'
          ]
          target = generated.get('35A5074F')
          assert target is not None
          assert target['TechnicalID'] == 'weapon.exesword'
          assert target['type'] == 'genericWeapon'
          assert target['durability'] == 72
          assert target['fatigue'] == -12
          assert all(row['type'] == 'genericWeapon' for row in source_only)
          evidence_path = Path('docs/sources/issue-230-item-hash-investigation.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          evidence['post_fix_pinned_output'] = {
              'source_only_added': stats['source_only_added'],
              'source_only_records': source_only,
              'target_entry': target,
          }
          evidence_path.write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence['post_fix_pinned_output'], indent=2, ensure_ascii=False))
          PY
      - name: Commit audit evidence
        shell: bash
        run: |
          rm .github/workflows/issue-230-postfix-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sources/issue-230-item-hash-investigation.json .github/workflows/issue-230-postfix-audit-once.yml
          git commit -m "Record source-only reference output audit"
          git push origin HEAD:codex/issue-230-equipped-item-hash
