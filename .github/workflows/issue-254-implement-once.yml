name: Issue 254 implement once
on:
  push:
    paths:
      - '.github/workflows/issue-254-implement-once.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-254-null-economics
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply implementation
        shell: pwsh
        run: python .tmp_issue254_patch.py
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r tests/requirements.txt
      - name: Run focused browser regression
        shell: pwsh
        run: python -m pytest -c tests/pytest.ini -o cache_dir=tests/cache/pytest tests/ui/test_recruitment_economics_browser.py -q
      - name: Run focused Ruff
        shell: pwsh
        run: python -m ruff check tests/ui/test_recruitment_economics_browser.py
      - name: Run focused Pyflakes
        shell: pwsh
        run: python -m pyflakes tests/ui/test_recruitment_economics_browser.py
      - name: Commit implementation
        shell: pwsh
        run: |
          git rm .tmp_issue254_patch.py .github/workflows/issue-254-implement-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbtool/app/static/recruitment.js tests/ui/test_recruitment_economics_browser.py
          git commit -m "Preserve unavailable Recruitment economics"
          git push origin HEAD:codex/issue-254-null-economics
